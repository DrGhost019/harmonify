<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="harm-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
  </defs>
  <!-- Background rounded squircle with subtle border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0d0d12" stroke="#22c55e" stroke-width="2" stroke-opacity="0.35" />
  
  <!-- Outer resonance ambient bars -->
  <path d="M11 26V38" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-opacity="0.45" />
  <path d="M53 26V38" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-opacity="0.45" />
  
  <!-- Left wave pillar of the 'H' -->
  <path d="M17 18V46" stroke="#22c55e" stroke-width="4.5" stroke-linecap="round" />
  
  <!-- Center harmonic frequency bars -->
  <path d="M24 22V42" stroke="#22c55e" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.85" />
  <path d="M32 14V50" stroke="#22c55e" stroke-width="4.5" stroke-linecap="round" />
  <path d="M40 22V42" stroke="#22c55e" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.85" />
  
  <!-- Right wave pillar of the 'H' -->
  <path d="M47 18V46" stroke="#22c55e" stroke-width="4.5" stroke-linecap="round" />
  
  <!-- Center cross-harmonic bridge uniting the waves into an 'H' -->
  <path d="M17 32H47" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-opacity="0.9" />
</svg>
